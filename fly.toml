app = "calcal"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_URL = "https://calcal.fly.dev"
  DATABASE_PATH = "/data/app.db"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[[mounts]]
  source = "calcal_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks.health]
  type = "http"
  port = 3000
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

# Reminder cron: use a Fly scheduled machine or an external scheduler:
#   fly machine run --schedule "*/1 * * * *" --app calcal \
#     --command "node -e \"fetch(process.env.APP_URL+'/api/cron/reminders',{method:'POST',headers:{authorization:'Bearer '+process.env.CRON_SECRET}})\""
